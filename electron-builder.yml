appId: com.matheusvmattos.estudaai
productName: EstudaAI
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # nome fixo: o link de download "latest" nunca muda
  artifactName: EstudaAI-Setup.${ext}
# a atualização automática lê as Releases deste repositório (público)
publish:
  provider: github
  owner: matheus-vmattos
  repo: EstudaAI
  releaseType: release
