# Publicar versão nova: mude "version" no package.json e leve para o main.
# Se ainda não existe Release dessa versão, esta ação gera o instalador no
# Windows e publica a Release (com a tag vX.Y.Z); os apps instalados se
# atualizam sozinhos a partir dela.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versão já publicada?
        id: versao
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          rascunho=$(gh release view "$v" --json isDraft --jq .isDraft 2>/dev/null || echo nenhuma)
          if [ "$rascunho" = false ]; then
            echo "publicada=sim" >> "$GITHUB_OUTPUT"
            echo "$v já tem Release: nada a fazer."
          elif [ "$rascunho" = true ]; then
            # sobra de uma execução que falhou no meio: recomeça do zero
            gh release delete "$v" --yes
          fi
      - if: steps.versao.outputs.publicada != 'sim'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.versao.outputs.publicada != 'sim'
        run: npm ci
      - if: steps.versao.outputs.publicada != 'sim'
        run: npm run build
      # A Release nasce aqui, uma vez, como rascunho: o electron-builder
      # sobe o instalador, o .blockmap e o latest.yml em paralelo e, sem
      # ela, cada envio tentava criar a mesma Release (o segundo dava 422).
      - if: steps.versao.outputs.publicada != 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.versao.outputs.tag }}" --draft --target "$GITHUB_SHA" --title "${{ steps.versao.outputs.tag }}" --notes ""
      - if: steps.versao.outputs.publicada != 'sim'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # só publica com os três arquivos lá: os apps instalados leem o latest.yml
      - if: steps.versao.outputs.publicada != 'sim'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.versao.outputs.tag }}"
          gh release view "$v" --json assets --jq '.assets[].name' | sort > enviados.txt
          cat enviados.txt
          grep -qx latest.yml enviados.txt && grep -qx EstudaAI-Setup.exe enviados.txt
          gh release edit "$v" --draft=false --latest
